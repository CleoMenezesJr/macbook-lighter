# configuration for macbook-lighter
#
# All brightness levels are percentages (0-100). The ambient light reading is
# normalized from darkness (0 %) to ML_BRIGHT_ENOUGH (100 %), and the screen
# and keyboard follow it between the limits below.

# check interval (in seconds)
ML_INTERVAL=5

# duration for each screen transition, in seconds
ML_DURATION=1.5

# time frame (in seconds) for each step of a sysfs transition (non-GNOME only)
ML_FRAME=0.017

# raw sensor reading considered full daylight (ambient 100 %)
ML_BRIGHT_ENOUGH=8

# screen brightness in complete darkness / in full light (%)
ML_SCREEN_MIN=2
ML_SCREEN_MAX=100

# lower the full-light screen brightness by this percentage on battery
ML_BATTERY_DIM=20

# ambient change (in percentage points) needed before the screen follows
ML_HYSTERESIS=5

# polls to confirm before brightening (fast)
ML_BRIGHTEN_CONFIRMS=1

# polls to confirm before dimming (slow)
ML_DIM_CONFIRMS=3

# keyboard brightness in complete darkness (%); it fades to 0 in full light
ML_KBD_BRIGHT=50

# turn off keyboard backlight after N seconds of inactivity (0 = disabled)
ML_KBD_TIMEOUT=30

# enable auto adjust screen backlight
# (on GNOME, the brightness button in Quick Settings toggles this at runtime)
ML_AUTO_SCREEN=true

# enable auto adjust keyboard backlight
ML_AUTO_KBD=true

# sub-samples per poll for median filter
ML_SENSOR_SAMPLES=3

# seconds between sub-samples
ML_SENSOR_SAMPLE_DELAY=0.3

# EWMA smoothing factor (0.0-1.0, lower = smoother)
ML_EWMA_ALPHA=0.5

# debug info to stdout
# Available values: false, true
ML_DEBUG=false
